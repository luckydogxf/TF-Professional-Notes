---
# ──────────────────────────────────────────────
# environment Configuration
# ──────────────────────────────────────────────
environment: "Dev"
application: "sport"
region: "cn-northwest-1"
profile: "dev"

# ──────────────────────────────────────────────
# VPC Configuration
# ──────────────────────────────────────────────
vpcs:
  primary:
    cidr: "10.10.0.0/16"
    azs: ["cn-northwest-1a", "cn-northwest-1b", "cn-northwest-1c"]
    subnets:
      public:
        - cidr: "10.10.0.0/22"
        - cidr: "10.10.4.0/22"
        - cidr: "10.10.8.0/22"
      private_ec2:
        - cidr: "10.10.16.0/22"
        - cidr: "10.10.20.0/22"
        - cidr: "10.10.24.0/22"
      private_eks:
        - cidr: "10.10.32.0/19"
        - cidr: "10.10.64.0/19"
        - cidr: "10.10.96.0/19"
    enable_nat_gateway: true
    single_nat_gateway: true
    one_nat_gateway_per_az: false 
    enable_s3_endpoint: true

###########  Security group ############
# ──────────────────────────────────────────────
#  Check config/security_groups/dev.yaml #
# ──────────────────────────────────────────────

# ──────────────────────────────────────────────
# iam role Configuration
# ──────────────────────────────────────────────
iam_roles:

  # ec2 --> s3 / custom/ standard policy
  ec2-s3-access:
    assume_role_policy_document: |
      {
        "Version": "2012-10-17",
        "Statement": [{
          "Effect": "Allow",
          "Principal": { "Service": "ec2.amazonaws.com" },
          "Action": "sts:AssumeRole"
        }]
      }

    policy_keys:
      # Define policy in [iam_policies] section...
      - "s3-access" 

    # OR/AND
    policy_arns:
      # allow ec2 instance to pull images from ECR.
      - "arn:aws-cn:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"

  app-pod:
    # eks pod -->redis/PGSQL/S3
    description: "IAM role for app-pod service account"
    namespace: default
    service_account: app-pod
    type: pod_identities     # ← 只有这个才创建关联
    assume_role_policy_document: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": {
              "Service": "pods.eks.amazonaws.com"
            },
            "Action": [
              "sts:AssumeRole",
              "sts:TagSession"
            ]
          }
        ]
      }
    policy_keys:
      - "s3-access"
      - "secrets-manager-access"

  external-secrets:
    description: "IAM role for External Secrets Operator"
    namespace: external-secrets
    service_account: external-secrets
    type: pod_identities
    assume_role_policy_document: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": {
              "Service": "pods.eks.amazonaws.com"
            },
            "Action": [
              "sts:AssumeRole",
              "sts:TagSession"
            ]
          }
        ]
      }
    policy_keys:
      - "secrets-manager-access" 

  eks-admin:
    description: "Dedicated EKS Cluster Administrator Role"
    # 账号和路径，仅放一个占位符，由后方的引擎动态计算
    assume_role_policy_document: "__DYNAMIC_SSO_ADMIN_POLICY__"

    policy_arns: [] 

# ──────────────────────────────────────────────
# iam policy Configuration
# ──────────────────────────────────────────────

iam_policies:

  s3-access:
    policy_json: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "s3:ListBucket",
              "s3:GetBucketLocation"
            ],
            "Resource": [
              "arn:aws-cn:s3:::xxx-admin-site-test",
              "arn:aws-cn:s3:::xxx-h5-site-test",
              "arn:aws-cn:s3:::xxx-media-test",
              "arn:aws-cn:s3:::xxx-ugc-test"
            ]
          },
          {
            "Effect": "Allow",
            "Action": [
              "s3:GetObject",
              "s3:PutObject",
              "s3:DeleteObject",
              "s3:AbortMultipartUpload"
            ],
            "Resource": [
              "arn:aws-cn:s3:::xxx-admin-site-test/*",
              "arn:aws-cn:s3:::xxx-h5-site-test/*",
              "arn:aws-cn:s3:::xxx-media-test/*",
              "arn:aws-cn:s3:::xxx-ugc-test/*"
            ]
          }
        ]
      } 
  secrets-manager-access:
    # 允许读取 Aurora 和 Redis 的密码
    policy_json: |
      {
        "Version": "2012-10-17",
        "Statement": [
            {
                "Effect": "Allow",
                "Action": [
                    "secretsmanager:GetSecretValue",
                    "secretsmanager:DescribeSecret"
                ],
                "Resource": "*",
                "Condition": {
                    "StringEquals": {
                        "aws:ResourceTag/environment": "dev"
                    }
                }
            },
            {
                "Effect": "Allow",
                "Action": [
                    "kms:Decrypt"
                ],
                "Resource": "*"
            }
        ]
      }

# ──────────────────────────────────────────────
# eks Configuration
# ──────────────────────────────────────────────
eks:
  cluster_version: "1.36"
  service_cidr: "172.20.0.0/16"
  endpoint_private_access: true
  endpoint_public_access: true
  endpoint_public_access_cidrs:
    - 0.0.0.0/0
  addon_versions:
    vpc-cni: "v1.23.0-eksbuild.1"
    coredns: "v1.14.3-eksbuild.14"
    kube-proxy: "v1.36.0-eksbuild.17"
    amazon-cloudwatch-observability: "v6.6.0-eksbuild.1"
    metrics-server: "v0.9.0-eksbuild.7"
    kube-state-metrics: "v2.19.1-eksbuild.5"
    eks-pod-identity-agent: "v1.4.0-eksbuild.1"

# ──────────────────────────────────────────────
# ec2 Configuration
# ──────────────────────────────────────────────
ec2_instances:
  bastion:
    instance_type: "t3.large"
    subnet_type: "public"
    subnet_index: 0
    security_groups: ["bastion"]
    snapshot_id: "snap-0466119b4ac60713f"          # 指定历史备份快照
    delete_on_termination: false                # 实例销毁时保留该卷，实现数据持久化
    iam_role: "ec2-s3-access"
    allocation_id: "eipalloc-0cabdf9fb73e8c1b4"
    key_name: "neo4j"
    custom_tags:
      Role: "JumpHost-Neo4j"

# ──────────────────────────────────────────────
# elasticache Configuration
# ──────────────────────────────────────────────
elasticache:
  redis:
    engine_version: "7.1"
    node_type: "cache.t4g.medium"
    num_node_groups: 2
    replicas_per_node_group: 1
    maxmemory_policy: "volatile-lru"
    subnet_type: "private_ec2"
    security_groups: ["redis"]
    # disalbe user authentication
    transit_encryption_enabled: false
    at_rest_encryption_enabled: false
    #auth_token_secret_name: "dev/fake_domain/redis/auth"  # 指向 AWS Secrets Manager 中的 Secret 路径
    automatic_failover_enabled: true
    multi_az_enabled: false
    snapshot_retention_limit: 7
    snapshot_window: "19:00-20:00"          # 对应 CST 北京时间每日 03:00 - 04:00
    maintenance_window: "sat:20:00-sat:21:00" # 对应 CST 北京时间周日 04:00 - 05:00 (UTC 为周六 20:00)
    parameter_group_name: "dev-fake_domain-redis7-params"
    parameter_group_family: "redis7"


# ──────────────────────────────────────────────
# aurora_postgresql Configuration
# ──────────────────────────────────────────────
aurora_postgresql:
  engine_version: "17.4"
  instance_class: "db.t4g.medium"
  instance_count: 2
  database_name: "appdb"
  master_username: "postgres"
  backup_retention_period: 7
  preferred_backup_window: "19:00-20:00"
  preferred_maintenance_window: "sun:20:00-sun:21:00"
  deletion_protection: true
  skip_final_snapshot: true
  subnet_type: "private_ec2"
  security_group_key: "aurora_pg"
  extensions:
    - "pgcrypto"
    - "citext"
    - "pg_trgm"
  parameter_group:
    family: "aurora-postgresql17"
    parameters:
      - name: "shared_preload_libraries"
        value: "pg_stat_statements"
        apply_method: "pending-reboot" 
      - name: "pg_stat_statements.track"
        value: "all"

