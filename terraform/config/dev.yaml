# ──────────────────────────────────────────────
# S3 Configuration
# ──────────────────────────────────────────────
s3:
  noncurrent_days: 30
  buckets:
    xxx-admin-site-test:
      force_destroy: true
    xxx-h5-site-test:
      force_destroy: true
    xxx-media-test:
      force_destroy: true
    xxx-ugc-test:
      force_destroy: true
# ──────────────────────────────────────────────
# CloudFront Configuration
# ──────────────────────────────────────────────
# 主域名和 ACM 证书 ARN
cloudfront:
  domain_name: "fake_domain.com"
  cert_arn: "arn:aws:acm:us-east-1:123456789012:certificate/xxxx-xxxx-xxxx"
  # 价格等级，200 表示覆盖美洲、欧洲和亚洲
  price_class: "PriceClass_200"
  # WAF Web ACL ARN，资源到位后替换 TODO
  web_acl_id: "TODO_WAF_WEB_ACL_ARN"

  s3_buckets:
    - "xxx-h5-site-test"
    - "xxx-admin-site-test"
    - "xxx-media-test"
    - "xxx-ugc-test"

  s3_subdomains:
    h5: "xxx-h5-site-test"
    admin: "xxx-admin-site-test"
    media: "xxx-media-test"
    ugc: "xxx-ugc-test"

  api_subdomains:
    api: "your-bff-gateway-hostname.execute-api.ap-northeast-1.amazonaws.com"
    admin-api: "your-admin-bff-hostname.execute-api.ap-northeast-1.amazonaws.com"

  # 源访问控制 (OAC) 配置
  oac:
    xxx-h5-site-test:
      description: "OAC for xxx-h5-site-test"
    xxx-admin-site-test:
      description: "OAC for xxx-admin-site-test"

  # CloudFront 分发配置
  distributions:
    # S3 静态网站分发
    s3-site:
      enabled: true
      comment: "CDN for S3 static sites"
      default_root_object: "index.html"
      aliases:
        - "h5-test.fake_domain.com"
        - "admin-test.fake_domain.com"
      origins:
        - origin_id: "S3-xxx-h5-site-test"
          type: "s3"
          bucket_name: "xxx-h5-site-test"
          oac_key: "xxx-h5-site-test"
        - origin_id: "S3-xxx-admin-site-test"
          type: "s3"
          bucket_name: "xxx-admin-site-test"
          oac_key: "xxx-admin-site-test"
      default_cache_behavior:
        target_origin_id: "S3-xxx-h5-site-test"
      custom_error_response:
        - error_code: 404
          response_code: 200
          response_page_path: "/index.html"
      logging_config:
        bucket: "TODO_LOGGING_BUCKET.s3.amazonaws.com"
        prefix: "cloudfront/s3-site/"
        include_cookies: false

    # API Gateway 分发
    api-gateway:
      enabled: true
      comment: "CDN for API Gateway"
      aliases:
        - "api-test.fake_domain.com"
        - "admin-api-test.fake_domain.com"
      origins:
        - origin_id: "API-bff"
          # Non-S3 origins websites.
          type: "custom"
          domain_name: "your-bff-gateway-hostname.execute-api.ap-northeast-1.amazonaws.com"
          origin_protocol_policy: "https-only"
        - origin_id: "API-admin-bff"
          type: "custom"
          domain_name: "your-admin-bff-hostname.execute-api.ap-northeast-1.amazonaws.com"
          origin_protocol_policy: "https-only"
      default_cache_behavior:
        target_origin_id: "API-bff"
        viewer_protocol_policy: "https-only"
        allowed_methods:
          - "GET"
          - "HEAD"
          - "OPTIONS"
          - "PUT"
          - "POST"
          - "PATCH"
          - "DELETE"
        cached_methods:
          - "GET"
          - "HEAD"
        cache_policy_id: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
        origin_request_policy_id: "TODO_ORIGIN_REQUEST_POLICY_ID"
        response_headers_policy_id: "TODO_RESPONSE_HEADERS_POLICY_ID"
      logging_config:
        bucket: "TODO_LOGGING_BUCKET.s3.amazonaws.com"
        prefix: "cloudfront/api-gateway/"
        include_cookies: false

# ──────────────────────────────────────────────
# waf Configuration
# ──────────────────────────────────────────────
waf:

  name: "eks-dev-waf"              # Base name for the WAF ACL (used for CloudWatch metrics and resource naming)
  scope: "REGIONAL"                # Deployment Scope: REGIONAL (for ALB, API Gateway, or EKS Ingress). Use CLOUDFRONT for CloudFront distributions.
  default_action: "ALLOW"          # Default action: Allow all requests that do not match any rules below (White-list mode)

  # -------------------------------------------------------------------------
  # 1. AWS Managed Rule Groups (Global threat intelligence against common attacks)
  # -------------------------------------------------------------------------
  aws_managed_rules:
    # [Priority 1] Core Rule Set (CRS): Protects against web risks like OWASP Top 10, Local File Inclusion (LFI), XSS, etc.
    - name: "AWSManagedRulesCommonRuleSet"
      priority: 1
      # 💡 Maintenance Note: Uncomment below to exclude specific rules if false positives occur (e.g., body size restrictions on file uploads)
      # excluded_rules:
      #   - "SizeRestrictions_BODY"  # Switches this specific rule to COUNT mode (log only, no block)

    # [Priority 2] Known Bad Inputs: Blocks known malicious request bodies, invalid inputs, and encoding bypass attempts
    - name: "AWSManagedRulesKnownBadInputsRuleSet"
      priority: 2

    # [Priority 3] Amazon IP Reputation List: Leverages AWS threat intelligence to block botnets, malicious crawlers, anonymous proxies, and Tor nodes
    - name: "AWSManagedRulesAmazonIpReputationList"
      priority: 3

    # [Extension Example] Future compatibility for AWS Marketplace third-party rules (The Terraform module natively supports this)
    # - name: "FortinetManagedRulesOWASPTop10"
    #   priority: 4
    #   vendor_name: "Fortinet"      # Explicitly required only for third-party marketplace rules

  # -------------------------------------------------------------------------
  # 2. Custom Business Protection Rules (Tailored security policies based on business needs)
  # -------------------------------------------------------------------------
  custom_rules:
    # [Rule 10] Malicious Bot / Scraper Mitigation
    # Logic: Blocks requests where the HTTP User-Agent header contains specific malicious strings
    - name: "BlockBadBots"
      priority: 10
      action: "BLOCK"              # Immediately blocks matching requests with a 403 Forbidden response
      statement:
        byte_match_statement:
          search_string: "bad-bot" # Signature string of the malicious crawler
          positional_constraint: "CONTAINS" # Substring match
          field_to_match:
            single_header:
              name: "user-agent"   # Target HTTP header field
          text_transformation:
            - priority: 0
              type: "NONE"         # No text conversion before matching

    # [Rule 15] Block Empty User-Agent
    # Logic: Automated scripts, primitive scraping tools, or DDoS vectors often emit blank User-Agents. Block them immediately.
    - name: "BlockEmptyUserAgent"
      priority: 15
      action: "BLOCK"
      statement:
        size_constraint_statement:
          comparison_operator: "EQ" # Size exactly equals
          size: 0                  # 0 bytes long
          field_to_match:
            single_header:
              name: "user-agent"
          text_transformation:
            - priority: 0
              type: "NONE"

    # [Rule 20] Geo-Location Geofencing (Blacklist Approach via NOT Operator)
    # Logic: Blocks all incoming traffic originating from any country EXCEPT CN (China) and US (United States)
    - name: "AllowOnlyTargetCountries"
      priority: 20
      action: "BLOCK"
      statement:
        not_statement:              # Inverts the logic of the inner geo_match
          statement:
            geo_match_statement:
              country_codes:
                - "CN"             # Allowed Country 1
                - "US"             # Allowed Country 2

    # [Rule 30] High-Value API Endpoint Rate Limiting (Layer 7 DDoS / Brute-Force Mitigation)
    # Logic: Limits the maximum number of requests a single source IP can make to the login endpoint within a rolling 5-minute window
    - name: "RateLimitLoginAPI"
      priority: 30
      action: "BLOCK"
      statement:
        rate_based_statement:
          limit: 100               # Request threshold per IP within 5 minutes (AWS minimum allowed is 10)
          aggregate_key_type: "IP"  # Tracks and counts requests based on client source IP
          scope_down_statement:    # Conditions that narrow down the rule applicability (applies only to login endpoint)
            byte_match_statement:
              search_string: "/api/v1/login"  # High-risk sensitive authentication endpoint
              positional_constraint: "STARTS_WITH" # Prefix match
              field_to_match:
                uri_path: {}       # Matches against the URL path
              text_transformation:
                - priority: 0
                  type: "NONE"

    # [Rule 40] Global IP Rate Limiting (Catch-All Anti-Scraping / Bulk Scanning Defenses)
    # Logic: A final safety net to block a single rogue IP from overwhelming the entire application with brute-force crawling
    - name: "RateLimitPerIP"
      priority: 40
      action: "BLOCK"
      statement:
        rate_based_statement:
          limit: 2000              # Global request threshold per IP within 5 minutes
          aggregate_key_type: "IP" # 💡 Maintenance Note: Omitting scope_down_statement applies this limit to ALL routes globally


